<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC-PLAYER</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="container">
        <div class="music-player">
            <nav>
                <div class="top-bar">
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="top-bar">
                    <i class="fa-solid fa-bars"></i> 
                </div>
            </nav>

            <img src="assets/Maclaren.jpg" class="song-img">
            <h1 id="track-title">Track Name</h1>
            <p id="artist-title">Artist</p>

            <audio id="audio-player"></audio>

            <div class="controls-wrapper">
                <input type="range" min="0" value="0" id="progress-bar">
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="duration-time">0:00</span>
                </div>
            </div>

            <div class="navigation">
                <i class="fa-solid fa-shuffle" id="shuff-btn"></i>
                <i class="fa-solid fa-backward" id="prev-btn"></i>
                <i class="fa-solid fa-play" id="navigation-circle"></i>
                <i class="fa-solid fa-forward" id="next-btn"></i>
                <i class="fa-solid fa-repeat" id="rep-btn"></i> 
            </div>

            <div class="bottom-icons">
                <i class="fa-regular fa-heart" id="like-btn"></i>
                <i class="fa-solid fa-list-check"></i>
            </div>
        </div>
    </div> 

    
    <script src="script.js"></script>

</body>
</html>
